
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVVA QR Generator</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  background:#f4f0e8;
  font-family:Arial,sans-serif;
  padding:30px 15px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card {
  background:#12284a;
  color:white;
  width:100%;
  max-width:440px;
  padding:30px;
  border-radius:20px;
  text-align:center;
}
h1 {letter-spacing:3px}
select,button {
  width:100%;
  padding:14px;
  border-radius:9px;
  font-size:16px;
  margin:10px 0;
}
button {
  border:0;
  background:white;
  color:#12284a;
  font-weight:bold;
  cursor:pointer;
}
.palette {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:20px 0;
}
.swatch {
  height:48px;
  border:2px solid #ffffff55;
  border-radius:9px;
  cursor:pointer;
}
.swatch.active {
  outline:3px solid white;
  outline-offset:2px;
}
#preview {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  margin:20px 0;
  border-radius:12px;
  background:#243b60;
}
#preview canvas {
  width:100%;
  max-width:260px;
  height:auto;
  image-rendering:pixelated;
}
input[type=color] {
  width:65px;
  height:45px;
  border:0;
  background:transparent;
  cursor:pointer;
}
.custom {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
}
#site {overflow-wrap:anywhere}
small {color:#d6dce7}
</style>
</head>
<body>
<div class="card">
  <h1>AVVA</h1>
  <p>QR Code Generator</p>

  <select id="siteChoice" onchange="generate()">
    <option value="building">AVVA Building</option>
    <option value="construct">AVVA Construct</option>
  </select>

  <h3>Колір QR-коду</h3>
  <div class="palette" id="palette"></div>

  <div class="custom">
    <span>Власний колір:</span>
    <input type="color" id="customColor"
      value="#ffffff" oninput="setColor(this.value)">
  </div>

  <div id="preview">
    <canvas id="qrCanvas"></canvas>
  </div>

  <p id="site"></p>
  <small>PNG завжди з прозорим фоном</small>

  <button onclick="downloadPNG()">
    Завантажити PNG
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const sites = {
  building:"https://www.avvabuilding.com/",
  construct:"https://www.avvaconstruct.com/"
};

const colors = [
  "#FFFFFF","#12284A","#111111","#D6C2A5",
  "#C5A46D","#777777","#5C9CCF","#286B54"
];

let currentColor="#FFFFFF";
const palette=document.getElementById("palette");

colors.forEach(color=>{
  const btn=document.createElement("button");
  btn.className="swatch";
  btn.style.backgroundColor=color;
  btn.title=color;
  btn.setAttribute("aria-label","Колір "+color);
  btn.onclick=()=>setColor(color);
  palette.appendChild(btn);
});

function setColor(color) {
  currentColor=color;
  document.getElementById("customColor").value=color;
  document.querySelectorAll(".swatch").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.title.toLowerCase()===color.toLowerCase()
    );
  });
  generate();
}

function generate() {
  const key=document.getElementById("siteChoice").value;
  const canvas=document.getElementById("qrCanvas");

  // Тимчасово створюємо QR у великому розмірі.
  const holder=document.createElement("div");

  new QRCode(holder,{
    text:sites[key],
    width:1000,
    height:1000,
    colorDark:"#000000",
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.H
  });

  const source=holder.querySelector("canvas");
  if(!source) return;

  const ctx=canvas.getContext("2d");
  canvas.width=2000;
  canvas.height=2000;
  ctx.clearRect(0,0,2000,2000);

  const temp=document.createElement("canvas");
  temp.width=source.width;
  temp.height=source.height;
  const tctx=temp.getContext("2d");
  tctx.drawImage(source,0,0);

  const img=tctx.getImageData(0,0,temp.width,temp.height);
  const rgb=[
    parseInt(currentColor.slice(1,3),16),
    parseInt(currentColor.slice(3,5),16),
    parseInt(currentColor.slice(5,7),16)
  ];

  for(let i=0;i<img.data.length;i+=4){
    const darkness=255-img.data[i];
    img.data[i]=rgb[0];
    img.data[i+1]=rgb[1];
    img.data[i+2]=rgb[2];
    img.data[i+3]=darkness;
  }

  tctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(temp,100,100,1800,1800);

  document.getElementById("site").textContent=sites[key];
}

function downloadPNG() {
  const canvas=document.getElementById("qrCanvas");
  const key=document.getElementById("siteChoice").value;
  const link=document.createElement("a");
  link.download="AVVA-"+key+"-QR.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}

setColor("#FFFFFF");
</script>
</body>
</html>
